<div class="fixed bottom-6 inset-x-margin-mobile z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none" id="toast-success">

</div>
</div>

<script>
  let currentCategory = 'Comida';
  let currentPayment = 'Efectivo';
  let currentDate = 'Hoy';

  function setDate(val, el) {
    currentDate = val;
    document.querySelectorAll('.date-chip').forEach(btn => {
      btn.className = 'date-chip py-space-sm rounded-lg font-label-md text-label-md bg-surface-container-low text-on-surface-variant text-center transition-all hover:bg-surface-container';
    });
    el.className = 'date-chip py-space-sm rounded-lg font-label-md text-label-md bg-primary text-on-primary text-center transition-all shadow-sm';
    document.getElementById('selected-date-label').innerText = val;
  }

  function openDatePicker(el) {
    const input = document.getElementById('hidden-date-picker');
    input.showPicker ? input.showPicker() : input.click();
    setDate('Otra', el);
  }

  function customDateSelected(val) {
    if (val) {
      const parts = val.split('-');
      const formatted = parts[2] + '/' + parts[1];
      document.getElementById('selected-date-label').innerText = formatted;
    }
  }

  function selectPayment(method, el) {
    currentPayment = method;
    document.querySelectorAll('.pay-chip').forEach(btn => {
      btn.className = 'pay-chip p-space-sm rounded-lg flex items-center gap-2 bg-surface-container-low text-on-surface-variant font-label-md text-label-md text-left transition-all hover:bg-surface-container';
    });
    el.className = 'pay-chip p-space-sm rounded-lg flex items-center gap-2 bg-primary-fixed text-on-primary-fixed font-label-md text-label-md text-left transition-all';
  }

  function selectCategory(name, emoji, el) {
    currentCategory = name;
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.className = 'cat-btn flex flex-col items-center justify-center p-space-sm rounded-xl bg-surface-container-low text-on-surface-variant transition-all hover:bg-surface-container transform active:scale-95';
    });
    el.className = 'cat-btn flex flex-col items-center justify-center p-space-sm rounded-xl bg-primary-fixed text-on-primary-fixed shadow-sm transition-all transform active:scale-95';
    document.getElementById('selected-category-name').innerText = emoji + ' ' + name;
  }

  function submitExpense() {
    const amountVal = document.getElementById('amount-input').value;
    const descVal = document.getElementById('desc-input').value || currentCategory;
    
    if (!amountVal || parseFloat(amountVal) <= 0) {
      const input = document.getElementById('amount-input');
      input.focus();
      return;
    }

    const toast = document.getElementById('toast-success');
    document.getElementById('toast-detail').innerText = '$ ' + amountVal + ' en ' + currentCategory + ' (' + currentPayment + ')';
    
    toast.classList.remove('translate-y-24', 'opacity-0');
    toast.classList.add('translate-y-0', 'opacity-100');

    setTimeout(() => {
      toast.classList.remove('translate-y-0', 'opacity-100');
      toast.classList.add('translate-y-24', 'opacity-0');
      setTimeout(() => {
        window.history.back();
      }, 300);
    }, 1200);
  }
</script></main></body></html>
