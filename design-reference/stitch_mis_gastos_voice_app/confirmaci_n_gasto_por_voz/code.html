  </head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-full antialiased"><header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.03)]"><div class="h-16 px-space-xs flex items-center justify-between"><div class="flex items-center"><button aria-label="Volver" class="w-12 h-12 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-low transition-colors" onclick="window.history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface ml-1">Nuevo Gasto</h1></div><div class="pr-margin-mobile flex items-center gap-space-xs"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface"><div class="flex flex-col w-full px-margin-mobile pb-space-xl">
<!-- Friendly Feedback Header -->
<div class="flex flex-col items-center text-center mt-space-md mb-space-lg">
<div class="inline-flex items-center gap-space-xs px-space-md py-1.5 rounded-full bg-primary-fixed text-on-primary-fixed font-label-md text-label-md mb-space-sm shadow-sm animate-pulse">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span>Capturado por voz</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">¿Está bien este gasto?</h2>
<!-- Audio Transcription Balloon -->
<div class="mt-space-sm max-w-xs bg-surface-container-low px-space-md py-space-xs rounded-xl flex items-center gap-space-xs">
<span class="material-symbols-outlined text-primary text-[18px]">mic</span>
<p class="font-body-sm text-body-sm text-on-surface-variant italic truncate">"Gasté 18 mil pesos en una cena ayer"</p>
</div>
</div>
<!-- Smart Editable Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-md p-space-lg flex flex-col gap-space-md mb-space-xl">
<!-- Big Amount Field -->
<div class="flex flex-col items-center justify-center py-space-sm bg-surface-container-low/60 rounded-xl">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-space-xs">Monto detectado</span>
<div class="flex items-center justify-center gap-space-xs group cursor-pointer" onclick="document.getElementById('input-amount').focus()">
<span class="font-headline-xl-mobile text-headline-xl-mobile text-primary font-bold">$</span>
<input class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface bg-transparent font-bold w-40 text-center focus:outline-none focus:text-primary transition-colors" id="input-amount" inputmode="numeric" type="text" value="18.000"/>
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[18px]">edit</span>
</div>
</div>
</div>
<!-- Category Row & Selector -->
<div class="flex flex-col gap-space-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">category</span> Categoría
        </label>
<span class="font-label-sm text-label-sm text-primary font-medium">Auto-sugerida</span>
</div>
<div class="flex gap-space-xs overflow-x-auto pb-1" id="category-pills">
<button class="cat-pill flex items-center gap-1.5 px-space-md py-space-xs rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md shadow-sm transition-all scale-100 active:scale-95" onclick="selectCategory(this)" type="button">
<span>🍔</span>
<span>Comida</span>
</button>
<button class="cat-pill flex items-center gap-1.5 px-space-md py-space-xs rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-all active:scale-95" onclick="selectCategory(this)" type="button">
<span>🛒</span>
<span>Supermercado</span>
</button>
<button class="cat-pill flex items-center gap-1.5 px-space-md py-space-xs rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-all active:scale-95" onclick="selectCategory(this)" type="button">
<span>🍻</span>
<span>Salidas</span>
</button>
<button class="cat-pill flex items-center gap-1.5 px-space-md py-space-xs rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-all active:scale-95" onclick="selectCategory(this)" type="button">
<span>🚗</span>
<span>Transporte</span>
</button>
</div>
</div>
<!-- Description Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1" for="input-desc">
<span class="material-symbols-outlined text-[16px]">notes</span> Detalle
      </label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-low text-on-surface px-space-md py-space-sm rounded-xl font-body-lg text-body-lg focus:outline-none focus:bg-surface-container transition-colors" id="input-desc" placeholder="¿En qué gastaste?" type="text" value="Cena"/>
<span class="material-symbols-outlined absolute right-space-md text-on-surface-variant/40 text-[18px]">draw</span>
</div>
</div>
<!-- Date Row -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">calendar_today</span> Fecha
      </label>
<div class="flex items-center gap-space-xs" id="date-chips">
<button class="date-chip flex-1 py-space-xs px-space-sm rounded-xl bg-primary text-on-primary font-label-md text-label-md flex items-center justify-center gap-1 shadow-sm transition-all" onclick="selectDate(this, '25/09/2026')" type="button">
<span class="material-symbols-outlined text-[16px]">check</span>
<span>Ayer (25 Sep)</span>
</button>
<button class="date-chip flex-1 py-space-xs px-space-sm rounded-xl bg-surface-container text-on-surface font-label-md text-label-md flex items-center justify-center gap-1 transition-all" onclick="selectDate(this, '26/09/2026')" type="button">
<span>Hoy</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-xl bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-colors" title="Elegir otra fecha" type="button">
<span class="material-symbols-outlined text-[18px]">edit_calendar</span>
</button>
</div>
</div>
<!-- Payment Method Chips -->
<div class="flex flex-col gap-space-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">payments</span> Medio de pago
        </label>
<span class="font-body-sm text-body-sm text-outline" id="payment-status">Elige uno</span>
</div>
<div class="grid grid-cols-2 gap-space-xs" id="payment-methods">
<button class="pay-btn flex items-center gap-2 px-space-md py-space-xs rounded-xl bg-secondary-container text-on-secondary-container font-label-md text-label-md transition-all active:scale-95 shadow-sm" onclick="selectPayment(this, 'Mercado Pago')" type="button">
<span class="material-symbols-outlined text-[18px]">account_balance_wallet</span>
<span>Mercado Pago</span>
</button>
<button class="pay-btn flex items-center gap-2 px-space-md py-space-xs rounded-xl bg-surface-container text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-all active:scale-95" onclick="selectPayment(this, 'Débito')" type="button">
<span class="material-symbols-outlined text-[18px]">credit_card</span>
<span>Débito</span>
</button>
<button class="pay-btn flex items-center gap-2 px-space-md py-space-xs rounded-xl bg-surface-container text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-all active:scale-95" onclick="selectPayment(this, 'Tarjeta')" type="button">
<span class="material-symbols-outlined text-[18px]">credit_score</span>
<span>Tarjeta</span>
</button>
<button class="pay-btn flex items-center gap-2 px-space-md py-space-xs rounded-xl bg-surface-container text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-all active:scale-95" onclick="selectPayment(this, 'Efectivo')" type="button">
<span class="material-symbols-outlined text-[18px]">payments</span>
<span>Efectivo</span>
</button>
</div>
</div>
</div>
<!-- Bottom Touch Actions (Thumb Reach) -->
<div class="flex flex-col gap-space-sm w-full mt-auto">
<button class="w-full h-14 bg-primary hover:bg-primary-container text-on-primary rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-space-xs shadow-md shadow-primary/20 active:scale-[0.98] transition-all cursor-pointer" id="save-btn" onclick="handleSave()" type="button">
<span class="material-symbols-outlined text-[22px]">check_circle</span>
<span>Guardar gasto</span>
</button>
<button class="w-full h-12 bg-transparent text-outline hover:text-error hover:bg-error-container/20 rounded-xl font-label-md text-label-md flex items-center justify-center transition-colors cursor-pointer" onclick="window.history.back()" type="button">
      Descartar
    </button>
</div>
<!-- Success Notification Feedback Toast -->
<div class="fixed bottom-6 inset-x-margin-mobile mx-auto max-w-sm bg-inverse-surface text-inverse-on-surface px-space-md py-space-sm rounded-xl shadow-xl flex items-center gap-space-sm opacity-0 pointer-events-none transition-all duration-300 transform translate-y-4 z-50" id="toast-success">
<span class="material-symbols-outlined text-primary-fixed text-[24px]">task_alt</span>
<div class="flex flex-col">
<span class="font-label-md text-label-md font-bold">¡Listo! Gasto añadido</span>
<span class="font-body-sm text-body-sm text-inverse-on-surface/80">Se actualizó tu balance del mes</span>
</div>
</div>
</div>
<script>
  function selectCategory(el) {
    document.querySelectorAll('.cat-pill').forEach(btn => {
      btn.className = 'cat-pill flex items-center gap-1.5 px-space-md py-space-xs rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-all active:scale-95';
    });
    el.className = 'cat-pill flex items-center gap-1.5 px-space-md py-space-xs rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md shadow-sm transition-all scale-100 active:scale-95';
  }

  function selectDate(el, dateText) {
    document.querySelectorAll('.date-chip').forEach(btn => {
      btn.className = 'date-chip flex-1 py-space-xs px-space-sm rounded-xl bg-surface-container text-on-surface font-label-md text-label-md flex items-center justify-center gap-1 transition-all';
      const checkIcon = btn.querySelector('.material-symbols-outlined');
      if (checkIcon) checkIcon.remove();
    });
    el.className = 'date-chip flex-1 py-space-xs px-space-sm rounded-xl bg-primary text-on-primary font-label-md text-label-md flex items-center justify-center gap-1 shadow-sm transition-all';
    
    const icon = document.createElement('span');
    icon.className = 'material-symbols-outlined text-[16px]';
    icon.textContent = 'check';
    el.prepend(icon);
  }

  function selectPayment(el, name) {
    document.querySelectorAll('.pay-btn').forEach(btn => {
      btn.className = 'pay-btn flex items-center gap-2 px-space-md py-space-xs rounded-xl bg-surface-container text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-all active:scale-95';
    });
    el.className = 'pay-btn flex items-center gap-2 px-space-md py-space-xs rounded-xl bg-secondary-container text-on-secondary-container font-label-md text-label-md transition-all active:scale-95 shadow-sm';
    
    const status = document.getElementById('payment-status');
    if (status) {
      status.textContent = name;
      status.className = 'font-body-sm text-body-sm text-secondary font-semibold';
    }
  }

  function handleSave() {
    const saveBtn = document.getElementById('save-btn');
    const toast = document.getElementById('toast-success');
    
    saveBtn.disabled = true;
    saveBtn.innerHTML = `
      <span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span>
      <span>Guardando...</span>
    `;

    setTimeout(() => {
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');
      
      setTimeout(() => {
        if (window.history.length > 1) {
          window.history.back();
        }
      }, 1200);
    }, 450);
  }
</script></main></body></html>
