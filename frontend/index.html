<!doctype html>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mis Gastos</title>
  <meta name="description" content="Registrá tus gastos por voz o manualmente en segundos.">
  <meta name="theme-color" content="#f8f9ff">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mis Gastos">
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/tokens.css">

<body>

      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l-5-5 5-5M5 12h11"/></symbol>

  </svg>

  <div id="offline-banner" class="offline-banner" role="status" hidden>
    Sin conexión: podés mirar la app, pero para guardar gastos necesitás internet.
  </div>

  <main id="app" class="app"></main>

  <nav class="bottom-nav" aria-label="Navegación principal" hidden>
    <a href="#/inicio" data-nav="inicio"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>Inicio</a>
    <a href="#/movimientos" data-nav="movimientos"><svg class="icon" aria-hidden="true"><use href="#i-receipt"/></svg>Movimientos</a>
    <a href="#/plan" data-nav="plan"><svg class="icon" aria-hidden="true"><use href="#i-target"/></svg>Plan</a>
    <a href="#/ajustes" data-nav="ajustes"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg>Ajustes</a>
  </nav>

  <dialog id="confirm-dialog" class="dialog" aria-labelledby="dialog-title">
    <form method="dialog">
      <h2 id="dialog-title" class="dialog__title" data-slot="title"></h2>
      <p class="dialog__message" data-slot="message"></p>
      <div class="dialog__actions">
        <button class="btn btn--outline" value="cancel">Cancelar</button>
        <button class="btn btn--primary" value="confirm">Confirmar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>Mis Gastos necesita JavaScript activado.</noscript>
</body>
</html>
