# Los tests usan una base H2 en memoria que imita a PostgreSQL:
# no hace falta tener PostgreSQL levantado para correr "mvn test".
# Es SOLO para tests: la app en desarrollo usa PostgreSQL (application-dev.properties).
spring.datasource.url=jdbc:h2:mem:misgastos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
app.auth.remember-me-key=clave-solo-para-tests
