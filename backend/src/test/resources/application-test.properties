# Los tests usan una base H2 en memoria que imita a PostgreSQL:
# no hace falta tener PostgreSQL levantado para correr "mvn test".
# Es SOLO para tests: la app en desarrollo usa PostgreSQL (application-dev.properties).
spring.datasource.url=jdbc:h2:mem:misgastos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
app.auth.remember-me-key=clave-solo-para-tests

# H2 deja las restricciones CHECK atadas a la conexión que las creó (la de Flyway al arrancar).
# Si el pool la renueva (por defecto cada 30 minutos), H2 ya no puede evaluarlas y todos los INSERT
# en tablas con CHECK fallan. Por eso, con H2 las conexiones no se renuevan. PostgreSQL no tiene este problema.
spring.datasource.hikari.max-lifetime=0
spring.datasource.hikari.idle-timeout=0
