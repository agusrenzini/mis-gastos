# En desarrollo se sirven los archivos directamente desde ../frontend:
# guardás un cambio, recargás el navegador y lo ves (sin reiniciar).
spring.web.resources.static-locations=file:../frontend/,classpath:/static/
spring.web.resources.cache.period=0

# PostgreSQL local: los datos persisten entre reinicios.
# La contraseña NO va acá: se toma de DB_PASSWORD (variable de entorno o backend/.env).
# H2 en memoria se usa solo en los tests automáticos (src/test/resources/application-test.properties).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mis_gastos}
spring.datasource.username=${DB_USERNAME:mis_gastos}
spring.datasource.password=${DB_PASSWORD}
