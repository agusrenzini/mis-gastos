spring.application.name=mis-gastos

# Si no se indica otro perfil, se usa "dev". En producción: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# Permite guardar las variables en backend/.env (ver .env.example). Ese archivo NO se sube a git.
spring.config.import=optional:file:.env[.properties]

# --- Base de datos PostgreSQL (siempre desde variables de entorno) ---
# Sin valores por defecto: en producción, si faltan las variables, la app no arranca.
# Los valores locales de desarrollo están en application-dev.properties.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway crea las tablas; Hibernate solo verifica que coincidan con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# --- Propias de la app ---
app.timezone=America/Argentina/Buenos_Aires
# Si APP_PASSWORD tiene valor, la app pide usuario y contraseña (HTTP Basic).
app.auth.username=${APP_USERNAME:yo}
app.auth.password=${APP_PASSWORD:}
